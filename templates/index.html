<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack AI Advisor</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gradient-to-br from-green-900 to-black min-h-screen text-white">
  <div class="max-w-2xl mx-auto p-6">
    <h1 class="text-5xl font-bold text-center mb-2">♠️ Blackjack AI ♣️</h1>
    <p class="text-center text-green-400 mb-8">Optimal Decision Assistant</p>

    <div class="bg-black/70 backdrop-blur-lg rounded-3xl shadow-2xl p-8">
      <div class="grid grid-cols-2 gap-6">
        <!-- Player -->
        <div>
          <label class="block text-sm mb-2">Your Hand Total</label>
          <input id="player_sum" type="number" min="4" max="21" value="16"
                 class="w-full bg-zinc-900 border border-green-600 rounded-xl px-4 py-4 text-4xl text-center focus:outline-none focus:border-green-400">
          <label class="flex items-center gap-2 mt-3">
            <input type="checkbox" id="soft" class="w-5 h-5 accent-green-500">
            <span>Soft Hand (has Ace)</span>
          </label>
        </div>

        <!-- Dealer -->
        <div>
          <label class="block text-sm mb-2">Dealer Upcard</label>
          <select id="dealer_up" class="w-full bg-zinc-900 border border-green-600 rounded-xl px-4 py-4 text-4xl text-center focus:outline-none focus:border-green-400">
            <option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option><option value="7">7</option>
            <option value="8">8</option><option value="9">9</option><option value="10" selected>10 / J / Q / K</option>
            <option value="11">A</option>
          </select>
        </div>
      </div>

      <button onclick="getPrediction()" 
              class="mt-8 w-full bg-green-600 hover:bg-green-500 transition py-5 rounded-2xl text-xl font-bold flex items-center justify-center gap-3">
        <i class="fas fa-brain"></i>
        WHAT SHOULD I DO?
      </button>

      <!-- Result -->
      <div id="result" class="mt-8 hidden text-center"></div>
    </div>

    <p class="text-center text-xs text-green-600 mt-8">Trained on 3M+ simulated hands • Basic Strategy + AI</p>
  </div>

  <script>
    async function getPrediction() {
      const player_sum = parseInt(document.getElementById('player_sum').value);
      const dealer_up = parseInt(document.getElementById('dealer_up').value);
      const soft = document.getElementById('soft').checked;

      const res = await fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: new URLSearchParams({ player_sum, dealer_up, soft })
      });

      const data = await res.json();
      
      const resultDiv = document.getElementById('result');
      let color = data.action === 'STAND' ? 'text-green-400' : 'text-orange-400';
      
      resultDiv.innerHTML = `
        <div class="bg-zinc-900 rounded-2xl p-8">
          <p class="text-sm text-gray-400">RECOMMENDED ACTION</p>
          <p class="text-6xl font-bold ${color} mt-2">${data.action}</p>
          <p class="text-green-400 mt-1">${data.confidence}% confidence</p>
          
          <div class="mt-6 grid grid-cols-2 text-sm">
            <div>Your Total: <span class="font-bold">${data.player_sum}</span></div>
            <div>Dealer Up: <span class="font-bold">${data.dealer_up === 11 ? 'A' : data.dealer_up}</span></div>
          </div>
        </div>
      `;
      resultDiv.classList.remove('hidden');
    }
  </script>
</body>
    </html>
